<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loop Labs Cockpit</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    margin: 0;
    background: #f4f5f7;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px;
    background: #202225;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; }
  .founder-select {
    display: flex;
    gap: 4px;
    background: #33363b;
    border-radius: 6px;
    padding: 2px;
  }
  .founder-select label {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  .founder-select input { display: none; }
  .founder-select input:checked + span {
    display: inline-block;
  }
  .founder-select label.active {
    background: #5865f2;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 60%;
    padding: 8px 12px;
    border-radius: 12px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble .label {
    display: block;
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .founder-msg {
    align-self: flex-end;
    background: #5865f2;
    color: #fff;
  }
  .agent-msg {
    align-self: flex-start;
    background: #e3e5e8;
    color: #1a1a1a;
  }
  #input-bar {
    display: flex;
    padding: 12px;
    gap: 8px;
    background: #fff;
    border-top: 1px solid #ddd;
  }
  #content-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  #send-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #5865f2;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled, #content-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .tool-call {
    align-self: flex-start;
    color: #888;
    font-style: italic;
    font-size: 12px;
    padding: 2px 4px;
  }
</style>
</head>
<body>

<header>
  <h1>Loop Labs Cockpit</h1>
  <div class="founder-select">
    <label id="label-a"><input type="radio" name="founder" value="A" checked><span>Founder A</span></label>
    <label id="label-b"><input type="radio" name="founder" value="B"><span>Founder B</span></label>
  </div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <input id="content-input" type="text" placeholder="Connecting..." disabled>
  <button id="send-btn" disabled>Send</button>
</div>

<script>
  let sessionId = null;
  let currentAgentBubble = null;
  let eventSource = null;

  const chat = document.getElementById('chat');
  const input = document.getElementById('content-input');
  const sendBtn = document.getElementById('send-btn');
  const founderRadios = document.querySelectorAll('input[name="founder"]');
  const labelA = document.getElementById('label-a');
  const labelB = document.getElementById('label-b');

  function updateFounderHighlight() {
    const selected = getSelectedFounder();
    labelA.classList.toggle('active', selected === 'A');
    labelB.classList.toggle('active', selected === 'B');
  }
  founderRadios.forEach(r => r.addEventListener('change', updateFounderHighlight));
  updateFounderHighlight();

  function getSelectedFounder() {
    return document.querySelector('input[name="founder"]:checked').value;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addFounderBubble(founder, text) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble founder-msg';
    bubble.innerHTML = '<span class="label">Founder ' + founder + '</span>';
    bubble.appendChild(document.createTextNode(text));
    chat.appendChild(bubble);
    scrollToBottom();
  }

  function ensureAgentBubble() {
    if (!currentAgentBubble) {
      currentAgentBubble = document.createElement('div');
      currentAgentBubble.className = 'bubble agent-msg';
      currentAgentBubble.innerHTML = '<span class="label">Agent</span><span class="text"></span>';
      chat.appendChild(currentAgentBubble);
    }
    return currentAgentBubble;
  }

  function appendToAgentBubble(text) {
    const bubble = ensureAgentBubble();
    bubble.querySelector('.text').textContent += text;
    scrollToBottom();
  }

  function closeAgentBubble() {
    currentAgentBubble = null;
  }

  async function startSession() {
    const founder = getSelectedFounder();
    const res = await fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ founder: founder })
    });
    const data = await res.json();
    sessionId = data.session_id;

    eventSource = new EventSource('/api/stream/' + sessionId);
    eventSource.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'text') {
        appendToAgentBubble(msg.content);
      } else if (msg.type === 'tool_call') {
        const line = document.createElement('div');
        line.className = 'tool-call';
        line.textContent = '→ ' + msg.content;
        chat.appendChild(line);
        scrollToBottom();
      } else if (msg.type === 'error') {
        appendToAgentBubble('⚠ ' + msg.content);
      } else if (msg.type === 'done') {
        closeAgentBubble();
      }
    };

    input.disabled = false;
    sendBtn.disabled = false;
    input.placeholder = 'Type a message...';
    input.focus();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !sessionId) return;
    const founder = getSelectedFounder();

    addFounderBubble(founder, text);
    input.value = '';

    await fetch('/api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, founder: founder, content: text })
    });
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  startSession();
</script>

</body>
</html>
