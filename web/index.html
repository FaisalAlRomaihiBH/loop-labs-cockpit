<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loop Labs Cockpit</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    margin: 0;
    background: #f4f5f7;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 16px;
    background: #202225;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .runs-link {
    color: #bbb;
    font-size: 13px;
    text-decoration: none;
  }
  .runs-link:hover {
    color: #fff;
    text-decoration: underline;
  }
  .founder-select {
    display: flex;
    gap: 4px;
    background: #33363b;
    border-radius: 6px;
    padding: 2px;
  }
  .founder-select label {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  .founder-select input { display: none; }
  .founder-select input:checked + span {
    display: inline-block;
  }
  .founder-select label.active {
    background: #5865f2;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 60%;
    padding: 8px 12px;
    border-radius: 12px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble .label {
    display: block;
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .founder-msg {
    align-self: flex-end;
    background: #5865f2;
    color: #fff;
  }
  .agent-msg {
    align-self: flex-start;
    background: #e3e5e8;
    color: #1a1a1a;
  }
  #input-bar {
    display: flex;
    padding: 12px;
    gap: 8px;
    background: #fff;
    border-top: 1px solid #ddd;
  }
  #content-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  #send-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #5865f2;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled, #content-input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #clear-btn {
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    color: #888;
    font-size: 14px;
    cursor: pointer;
  }
  #clear-btn:hover {
    background: #f0f0f0;
    color: #d13438;
  }
  .tool-call {
    align-self: flex-start;
    color: #888;
    font-style: italic;
    font-size: 12px;
    padding: 2px 4px;
  }
  /* Rendered markdown inside agent bubbles */
  .agent-msg .text { white-space: normal; }
  .agent-msg .text h1, .agent-msg .text h2, .agent-msg .text h3, .agent-msg .text h4 {
    margin: 10px 0 4px;
    line-height: 1.3;
  }
  .agent-msg .text h1 { font-size: 18px; }
  .agent-msg .text h2 { font-size: 16px; }
  .agent-msg .text h3 { font-size: 15px; }
  .agent-msg .text h4 { font-size: 14px; }
  .agent-msg .text p { margin: 6px 0; }
  .agent-msg .text ul, .agent-msg .text ol { margin: 6px 0; padding-left: 22px; }
  .agent-msg .text li { margin: 3px 0; }
  .agent-msg .text code {
    background: #d6d9de;
    padding: 1px 4px;
    border-radius: 3px;
    font-family: Consolas, "SF Mono", monospace;
    font-size: 12.5px;
  }
  .agent-msg .text pre {
    background: #2b2d31;
    color: #e8e8e8;
    padding: 8px 10px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 6px 0;
  }
  .agent-msg .text pre code { background: none; color: inherit; padding: 0; }
  .agent-msg .text table { border-collapse: collapse; margin: 8px 0; }
  .agent-msg .text th, .agent-msg .text td {
    border: 1px solid #c5c8cd;
    padding: 4px 9px;
    font-size: 13px;
    text-align: left;
  }
  .agent-msg .text th { background: #d6d9de; }
  .agent-msg .text hr { border: none; border-top: 1px solid #c5c8cd; margin: 10px 0; }
</style>
</head>
<body>

<header>
  <h1>Loop Labs Cockpit</h1>
  <div class="right">
    <a class="runs-link" href="#" id="new-chat-link">new chat</a>
    <a class="runs-link" href="/runs">runs</a>
    <div class="founder-select">
      <label id="label-a"><input type="radio" name="founder" value="A" checked><span>Hasan</span></label>
      <label id="label-b"><input type="radio" name="founder" value="B"><span>Faisal</span></label>
    </div>
  </div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <input id="content-input" type="text" placeholder="Connecting..." disabled>
  <button id="clear-btn" title="Clear the message box">&#10005;</button>
  <button id="send-btn" disabled>Send</button>
</div>

<script>
  let sessionId = null;
  let currentAgentBubble = null;
  let eventSource = null;

  const chat = document.getElementById('chat');
  const input = document.getElementById('content-input');
  const sendBtn = document.getElementById('send-btn');
  const founderRadios = document.querySelectorAll('input[name="founder"]');
  const labelA = document.getElementById('label-a');
  const labelB = document.getElementById('label-b');

  function updateFounderHighlight() {
    const selected = getSelectedFounder();
    labelA.classList.toggle('active', selected === 'A');
    labelB.classList.toggle('active', selected === 'B');
  }
  founderRadios.forEach(r => r.addEventListener('change', updateFounderHighlight));
  updateFounderHighlight();

  function getSelectedFounder() {
    return document.querySelector('input[name="founder"]:checked').value;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  const FOUNDER_NAMES = { A: 'Hasan', B: 'Faisal' };

  function addFounderBubble(founder, text) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble founder-msg';
    bubble.innerHTML = '<span class="label">' + (FOUNDER_NAMES[founder] || founder) + '</span>';
    bubble.appendChild(document.createTextNode(text));
    chat.appendChild(bubble);
    scrollToBottom();
  }

  function ensureAgentBubble() {
    if (!currentAgentBubble) {
      currentAgentBubble = document.createElement('div');
      currentAgentBubble.className = 'bubble agent-msg';
      currentAgentBubble.innerHTML = '<span class="label">Agent</span><div class="text"></div>';
      currentAgentBubble._raw = '';
      chat.appendChild(currentAgentBubble);
    }
    return currentAgentBubble;
  }

  function appendToAgentBubble(text) {
    const bubble = ensureAgentBubble();
    bubble._raw += text;
    bubble.querySelector('.text').innerHTML = mdToHtml(bubble._raw);
    scrollToBottom();
  }

  // --- Minimal markdown renderer for agent messages -----------------------
  // Escape first, format second: message text can never inject HTML.

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function mdInline(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  }

  function mdToHtml(raw) {
    const lines = escapeHtml(raw).split('\n');
    const out = [];
    let para = [], list = null, listType = '', table = [], inCode = false, codeLines = [];

    function flushPara() {
      if (para.length) { out.push('<p>' + para.map(mdInline).join('<br>') + '</p>'); para = []; }
    }
    function flushList() {
      if (list) { out.push('<' + listType + '>' + list.join('') + '</' + listType + '>'); list = null; }
    }
    function flushTable() {
      if (!table.length) return;
      const rows = table.map(l => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim()));
      let html = '<table>', start = 0;
      if (rows.length > 1 && rows[1].every(c => /^:?-{2,}:?$/.test(c))) {
        html += '<tr>' + rows[0].map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr>';
        start = 2;
      }
      for (let i = start; i < rows.length; i++) {
        html += '<tr>' + rows[i].map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>';
      }
      out.push(html + '</table>');
      table = [];
    }
    function flushAll() { flushPara(); flushList(); flushTable(); }

    for (const line of lines) {
      if (inCode) {
        if (/^```/.test(line)) { out.push('<pre><code>' + codeLines.join('\n') + '</code></pre>'); inCode = false; codeLines = []; }
        else codeLines.push(line);
        continue;
      }
      if (/^```/.test(line)) { flushAll(); inCode = true; continue; }

      const heading = line.match(/^(#{1,4})\s+(.*)$/);
      if (heading) { flushAll(); out.push('<h' + heading[1].length + '>' + mdInline(heading[2]) + '</h' + heading[1].length + '>'); continue; }

      if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { flushAll(); out.push('<hr>'); continue; }

      if (/^\s*\|.*\|\s*$/.test(line)) { flushPara(); flushList(); table.push(line); continue; }

      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (bullet || numbered) {
        flushPara(); flushTable();
        const type = bullet ? 'ul' : 'ol';
        if (!list || listType !== type) { flushList(); list = []; listType = type; }
        list.push('<li>' + mdInline((bullet || numbered)[1]) + '</li>');
        continue;
      }

      if (!line.trim()) { flushAll(); continue; }

      flushList(); flushTable();
      para.push(line);
    }
    if (inCode) out.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
    flushAll();
    return out.join('');
  }

  function closeAgentBubble() {
    currentAgentBubble = null;
  }

  function renderHistory(messages) {
    for (const m of messages) {
      if (m.role === 'founder') {
        addFounderBubble(m.founder, m.content);
      } else if (m.role === 'agent') {
        appendToAgentBubble(m.content);
        closeAgentBubble();
      }
    }
  }

  async function startSession() {
    // Reuse the stored session so the conversation survives page reloads
    // and detours to the runs page. "new chat" clears it.
    const stored = localStorage.getItem('cockpitSessionId');
    if (stored) {
      try {
        const res = await fetch('/api/session/' + stored + '/messages');
        if (res.ok) {
          const data = await res.json();
          sessionId = data.session_id;
          renderHistory(data.messages);
        }
      } catch (e) { /* fall through to a fresh session */ }
    }

    if (!sessionId) {
      const founder = getSelectedFounder();
      const res = await fetch('/api/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ founder: founder })
      });
      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem('cockpitSessionId', sessionId);
    }

    eventSource = new EventSource('/api/stream/' + sessionId);
    eventSource.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'text') {
        appendToAgentBubble(msg.content);
      } else if (msg.type === 'tool_call') {
        const line = document.createElement('div');
        line.className = 'tool-call';
        line.textContent = '→ ' + msg.content;
        chat.appendChild(line);
        scrollToBottom();
      } else if (msg.type === 'error') {
        appendToAgentBubble('⚠ ' + msg.content);
      } else if (msg.type === 'done') {
        closeAgentBubble();
      }
    };

    input.disabled = false;
    sendBtn.disabled = false;
    input.placeholder = 'Type a message...';
    input.focus();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !sessionId) return;
    const founder = getSelectedFounder();

    addFounderBubble(founder, text);
    input.value = '';

    await fetch('/api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, founder: founder, content: text })
    });
  }

  // Two-click confirm: dialogs (confirm/alert) are unreliable in embedded
  // browsers, so the link itself asks for the second click.
  const newChatLink = document.getElementById('new-chat-link');
  let newChatArmed = null;
  newChatLink.addEventListener('click', (e) => {
    e.preventDefault();
    if (newChatArmed) {
      localStorage.removeItem('cockpitSessionId');
      window.location.reload();
      return;
    }
    newChatLink.textContent = 'click again for new chat';
    newChatLink.style.color = '#ffb020';
    newChatArmed = setTimeout(() => {
      newChatArmed = null;
      newChatLink.textContent = 'new chat';
      newChatLink.style.color = '';
    }, 4000);
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    input.value = '';
    input.focus();
  });

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  startSession();
</script>

</body>
</html>
